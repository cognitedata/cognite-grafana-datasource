[supervisord]
nodaemon=true
user=root

[program:grafana]
user=root
directory=/var/lib/grafana
command=bash -c 'arch=$(/usr/local/go/bin/go env GOHOSTARCH) || exit 1; until [ -x "/root/cognitedata-datasource/dist/gpx_cognite_datasource_linux_${arch}" ]; do sleep 1; done; exec /run.sh'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
killasgroup=true
stopasgroup=true
autostart=true

[program:delve]
user=root
command=/bin/bash -c 'until pid=$(pgrep -of "^([^[:space:]]*/)?gpx_cognite_datasource_linux_(amd64|arm64|arm)([[:space:]]|$)"); do sleep 1; done; exec /root/go/bin/dlv attach --api-version=2 --headless --continue --accept-multiclient --listen=:2345 "$pid"'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
killasgroup=false
stopasgroup=false
autostart=true
autorestart=true

[program:build-watcher]
user=root
command=/bin/bash -c 'while inotifywait -e modify,create,delete -r /var/lib/grafana/plugins/cognitedata-datasource; do echo "Change detected, restarting delve...";supervisorctl restart delve; done'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
killasgroup=true
stopasgroup=true
autostart=true

[program:mage-watcher]
user=root
environment=PATH="/usr/local/go/bin:/root/go/bin:%(ENV_PATH)s"
directory=/root/cognitedata-datasource
command=/bin/bash -c 'git config --global --add safe.directory /root/cognitedata-datasource && mage -v watch'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
killasgroup=true
stopasgroup=true
autostart=true
