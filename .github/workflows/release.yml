name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    # The steps of grafana/plugin-actions/build-plugin, inlined: that action calls
    # package-plugin@main, and the organization only allows actions pinned to a
    # full commit SHA, nested ones included.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read the Go version from go.mod
        id: go
        shell: bash
        # go.mod's toolchain line is the one place the Go version is set. setup-go
        # exports GOTOOLCHAIN=local, so Go never switches to it by itself: it has to
        # be requested here, exactly, or a cached older patch release builds instead.
        run: |
          version=$(sed -n 's/^toolchain go//p' go.mod)
          if [ -z "$version" ]; then
            echo "::error::go.mod has no toolchain line naming the Go version to build with"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        id: package-plugin
        uses: grafana/plugin-actions/package-plugin@8377a91095147d68ea3a51681aa1773ed7f0025c # package-plugin/v1.3.3
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          go-version: ${{ steps.go.outputs.version }}
          node-version: '20'

      - name: Check the packaged backend's Go version and vulnerabilities
        shell: bash
        env:
          PLUGIN_ARCHIVE: ${{ steps.package-plugin.outputs.archive }}
          PLUGIN_VERSION: ${{ steps.package-plugin.outputs.plugin-version }}
          GO_VERSION: ${{ steps.go.outputs.version }}
        run: |
          unzip -q -o "$PLUGIN_ARCHIVE" -d "$RUNNER_TEMP/plugin"
          shopt -s nullglob
          binaries=("$RUNNER_TEMP"/plugin/*/gpx_*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "::error::The archive holds no backend binaries"
            exit 1
          fi
          # Every binary must be built with the Go version go.mod names.
          for bin in "${binaries[@]}"; do
            built=$(go version "$bin" | awk '{print $2}')
            echo "$(basename "$bin"): $built"
            if [ "$built" != "go${GO_VERSION}" ]; then
              echo "::error::$(basename "$bin") was built with $built, not go${GO_VERSION} from go.mod"
              exit 1
            fi
          done
          for bin in "$RUNNER_TEMP"/plugin/*/gpx_*_linux_amd64; do
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode binary "$bin"
          done
          # The release's changelog section must name that Go version too.
          section=$(awk -v heading="## ${PLUGIN_VERSION} " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md)
          if ! grep -qF "Go ${GO_VERSION}" <<< "$section"; then
            echo "::error::The ${PLUGIN_VERSION} section of CHANGELOG.md does not name Go ${GO_VERSION}, the version the backend is built with"
            exit 1
          fi

      - name: Check package version
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.package-plugin.outputs.plugin-version }}
        run: |
          if [ "v${PLUGIN_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            printf "\033[0;31mPlugin version doesn't match tag name. The tag should be v${PLUGIN_VERSION}\033[0m\n"
            exit 1
          fi

      - name: Generate artifact attestation
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package-plugin.outputs.archive }}

      - name: Create Github release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./${{ steps.package-plugin.outputs.archive }}
            ./${{ steps.package-plugin.outputs.archive-sha1sum }}
          body: |
            **This Github draft release has been created for your plugin.**

            If you would like to submit this release to Grafana please consider the following steps:

            - Check the Validate plugin step in the [release workflow](https://github.com/${{ github.repository }}/commit/${{ github.sha }}/checks/${{ github.run_id }}) for any warnings that need attention
            - **Edit this draft release**, adjust these notes accordingly and click **Publish Release**
            - Navigate to https://grafana.com/auth/sign-in/ to sign into your account
            - Once logged in click **My Plugins** in the admin navigation
            - Click the **Submit Plugin** button
            - Fill in the Plugin Submission form:
              - Paste this [.zip asset link](https://github.com/${{ github.repository }}/releases/download/v${{ steps.package-plugin.outputs.plugin-version }}/${{ steps.package-plugin.outputs.archive }}) in the Plugin URL field
              - Paste this [.zip.sha1 link](https://github.com/${{ github.repository }}/releases/download/v${{ steps.package-plugin.outputs.plugin-version }}/${{ steps.package-plugin.outputs.archive-sha1sum }}) in the SHA1 field

            If the links above are not working, you must first edit this draft release and publish it.

            This build has been attested. You can view the attestation details [here](${{ steps.attestation.outputs.attestation-url }}).
